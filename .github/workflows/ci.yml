name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:types
      - run: npm run check:release
      - name: Validate stable release packaging
        run: |
          bash -n deploy.sh
          python3 -B scripts/package-release.py --output .tmp/release
          (cd .tmp/release && sha256sum -c SHA256SUMS)
          bash -n .tmp/release/update.sh
          python3 -B - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('updater', 'scripts/update-release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          directory = Path('.tmp/distributable')
          directory.mkdir()
          archive = next(Path('.tmp/release').glob('*.tar.gz'))
          tag = archive.name.removeprefix('codex-agent-platform-').removesuffix('.tar.gz')
          module.extract(archive, directory, tag)
          PY
      - name: Verify isolated code containers and approved network boundary
        run: |
          docker build -f Dockerfile.sandbox -t codex-agent-platform-sandbox:1.0.2 .tmp/distributable
          node_bin=$(command -v node)
          sudo --preserve-env=HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY,http_proxy,https_proxy,all_proxy,no_proxy env SANDBOX_DOCKER_TEST=1 SANDBOX_REQUIRE_NETWORK_TEST=1 "$node_bin" --test tests/sandbox-runtime.test.mjs tests/sandbox-docker-integration.test.mjs tests/sandbox-network.test.mjs
      - name: Build all release targets
        run: |
          version=$(node -p "require('./package.json').version")
          for target in gateway runner manager test; do
            docker build --target "$target" -t "codex-agent-platform-$target" -t "codex-agent-platform-$target:$version" .tmp/distributable
          done
      - run: docker run --rm --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,exec,size=512m,mode=1777 -e HOME=/tmp codex-agent-platform-test
      - name: Verify real Compose self-update with synthetic data
        run: sudo python3 -B tests/integration/release-update-smoke.py --source .tmp/distributable --archive .tmp/release/codex-agent-platform-v$(node -p "require('./package.json').version").tar.gz
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
