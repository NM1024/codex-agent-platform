<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent · 运行工作台</title>
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/app.js" type="module"></script>
  </head>
  <body>
    <div id="login" class="login">
      <form id="login-form" class="login-card">
        <div class="login-top">
          <div class="brand">A<span> / </span>AGENT</div>
          <select
            id="login-language"
            data-language-switch
            aria-label="界面语言"
          >
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <h1 data-i18n="从这里，了解并管理运行。">从这里，了解并管理运行。</h1>
        <p data-i18n="使用独立 Admin 密码登录，初始密码由部署时生成。">
          使用独立 Admin 密码登录，初始密码由部署时生成。
        </p>
        <label for="password" data-i18n="Admin 密码">Admin 密码</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="输入 Admin 密码"
          data-i18n-placeholder="输入 Admin 密码"
        /><button type="submit">
          <span data-i18n="登录工作台">登录工作台</span
          ><span aria-hidden="true">→</span>
        </button>
        <p id="login-error" role="alert"></p>
      </form>
    </div>
    <div id="workspace" class="workspace hidden">
      <aside class="sidebar">
        <a class="brand" href="/admin/">A<span> / </span>AGENT</a>
        <div class="sidebar-label" data-i18n="运行工作台">运行工作台</div>
        <nav id="navigation">
          <button data-view="overview" class="selected">
            ◈ <span data-i18n="运行概览">运行概览</span></button
          ><button data-view="chat">
            ◎ <span data-i18n="管理对话">管理对话</span></button
          ><button data-view="tasks">
            ≡ <span data-i18n="任务记录">任务记录</span></button
          ><button data-view="plugins">
            ◇ <span data-i18n="业务插件">业务插件</span></button
          ><button data-view="schedules">
            ◷ <span data-i18n="定时计划">定时计划</span></button
          ><button data-view="settings">
            ⚙ <span data-i18n="系统配置">系统配置</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <span class="dot"></span
          ><span id="connection" data-i18n="已连接">已连接</span>
        </div>
      </aside>
      <main>
        <header>
          <div>
            <p class="eyebrow">YOUR SYSTEM, IN VIEW</p>
            <h1 id="page-title" data-i18n="运行概览">运行概览</h1>
          </div>
          <div class="header-actions">
            <select
              id="app-language"
              data-language-switch
              aria-label="界面语言"
            >
              <option value="zh-CN">简体中文</option>
              <option value="en">English</option></select
            ><span id="updated"></span
            ><button id="logout" class="secondary" data-i18n="退出">退出</button
            ><button id="refresh" class="secondary" data-i18n="刷新">
              刷新
            </button>
          </div>
        </header>
        <div id="notice" class="notice hidden" role="status"></div>
        <section id="view"></section>
      </main>
    </div>
  </body>
</html>
